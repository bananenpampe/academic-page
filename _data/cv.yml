cv:
  name: Matthias Kellner
  label: PhD Student in Computational Materials Science
  location: Lausanne, Switzerland
  website: https://kellner.science
  image: ""
  summary: >-
    I develop machine-learning methods for atomistic simulation, with a focus on uncertainty quantification.
    I am interested in determining when a model's predictions can be trusted and when they cannot, which is a
    question central to deploying ML reliably in the physical sciences. I am also involved in the development of
    universal machine learning potentials. I have developed the universal PET-MOLS model and applied it to study
    amorphously formulated active pharmaceutical ingredients. I also build deep-learning models for predicting NMR
    chemical shieldings (ShiftML), which I make available to the wider chemistry community.

